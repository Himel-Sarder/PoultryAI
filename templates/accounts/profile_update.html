{% extends 'base.html' %}
{% block title %}Update Profile{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h4 class="fw-bold mb-4">Update Profile</h4>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            {{ form.full_name }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Phone Number</label>
                            {{ form.phone_number }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Profile Image</label>
                            {{ form.profile_image }}
                            {% if user.profile_image %}
                            <div class="mt-2"><img src="{{ user.profile_image.url }}" width="80" height="80" class="rounded-circle" style="object-fit:cover"></div>
                            {% endif %}
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">Save Changes</button>
                            <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
