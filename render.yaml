services:
  - type: web
    name: poultry_farm
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn poultry_farm.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: poultry_farm.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: poultry_farm_db
          property: connectionString
    staticPublishPath: staticfiles
